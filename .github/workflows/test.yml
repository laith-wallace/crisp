name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: Versions agree
        run: |
          v=$(node -p "require('./package.json').version")
          node -e "const p=require('./.claude-plugin/plugin.json'),m=require('./.claude-plugin/marketplace.json');if(p.version!=='$v'||m.plugins.some(x=>x.version!=='$v'))process.exit(1)"
