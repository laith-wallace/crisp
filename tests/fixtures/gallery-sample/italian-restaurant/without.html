<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nonna's</title>
<style>
body { font-family: Inter, sans-serif; margin: 0; }
.hero { background: linear-gradient(135deg, #7c3aed, #2563eb); color: #fff; padding: 80px 24px; text-align: center; }
.hero h1 { background: linear-gradient(90deg, #fff, #c4b5fd); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pill { display: inline-block; border-radius: 999px; padding: 4px 12px; background: rgba(255,255,255,.2); }
.card { transition: all .3s; }
.card:hover { transform: scale(1.05); }
</style>
</head>
<body>
<section class="hero">
  <span class="pill">New</span>
  <h1>Supercharge your dinner with world-class Italian</h1>
  <p>A seamless dining experience.</p>
  <a href="#">Book now</a>
</section>
<section>
  <div class="card"><h3>🍝 Fresh pasta</h3><p>Made daily.</p></div>
  <div class="card"><h3>🍷 Fine wine</h3><p>Curated list.</p></div>
  <div class="card"><h3>🍕 Wood-fired pizza</h3><p>Authentic taste.</p></div>
</section>
</body>
</html>
