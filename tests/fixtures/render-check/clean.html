<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font: 16px/1.4 system-ui, sans-serif; margin: 0; padding: 24px; }
  .card { background: #f4f4f5; padding: 16px; border-radius: 12px; margin-bottom: 24px; max-width: 480px; }
  .btn { background: #111; color: #fff; border: 0; padding: 10px 16px; font-size: 14px; border-radius: 8px; }
  .clip { max-width: 160px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip: rect(0,0,0,0); white-space:nowrap; }
</style></head>
<body>
  <main>
    <h1>Deals</h1>
    <div class="card"><h2>No deals yet</h2><p>Add your first deal to see it here.</p><button class="btn">Add a deal</button></div>
    <p class="clip">A long label that ends with an ellipsis on purpose</p>
    <p>Read the <a href="#">full guide</a> before you start.</p>
    <span class="sr-only">Screen reader only text</span>
  </main>
</body></html>
